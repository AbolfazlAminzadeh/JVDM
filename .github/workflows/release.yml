name: Build Native Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-natives:
    name: Build Native Compiles (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: JVDM-linux-x86_64
            binary_path: build/native/nativeCompile/JVDM
          - os: windows-latest
            artifact_name: JVDM-windows-x86_64.exe
            binary_path: build/native/nativeCompile/JVDM.exe
          - os: macos-13
            artifact_name: JVDM-macos-x86_64
            binary_path: build/native/nativeCompile/JVDM
          - os: macos-latest
            artifact_name: JVDM-macos-aarch64
            binary_path: build/native/nativeCompile/JVDM

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup GraalVM 25 with native-image
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          components: 'native-image'
          native-image-job-reports: 'true'

      - name: Install System Dependencies (Linux only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxext-dev libxrender-dev libxtst-dev libxt-dev libasound2-dev libgtk-3-dev

      - name: Ensure MSVC (Windows) available
        if: matrix.os == 'windows-latest'
        run: |
          echo "windows-latest runners normally include MSVC. Listing cl.exe location (if present):"
          where cl || echo "cl.exe not found - native compilation on Windows will likely fail without Visual C++ tools."
        shell: cmd

      - name: Setup Gradle (cache & wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper executable (for macOS/Linux)
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew
        shell: bash

      - name: Run Native Compilation
        run: |
          echo "Running nativeCompile on ${GITHUB_RUNNER_OS}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "Invoking Windows Gradle wrapper (.\\gradlew.bat)"
            cmd.exe /c ".\\gradlew.bat nativeCompile --no-daemon --stacktrace --info"
          else
            ./gradlew nativeCompile --no-daemon --stacktrace --info
          fi
        shell: bash

      - name: Show native output directory (debug)
        run: |
          echo "Listing build/native/nativeCompile (if present):"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cmd.exe /c "dir build\\native\\nativeCompile || echo Directory not found"
          else
            ls -la build/native/nativeCompile || echo "Directory not found"
          fi
        shell: bash

      - name: Validate native binary exists
        run: |
          echo "Checking for binary at: ${{ matrix.binary_path }}"
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cmd.exe /c "if not exist \"${{ matrix.binary_path }}\" (echo Binary not found: ${{ matrix.binary_path }} & exit 1) else (echo Binary found)"
          else
            if [ ! -f "${{ matrix.binary_path }}" ]; then
              echo "Binary not found: ${{ matrix.binary_path }}"
              exit 1
            fi
            echo "Binary found: ${{ matrix.binary_path }}"
          fi
        shell: bash

      - name: Prepare Artifact (copy binary into dist/)
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            powershell -Command "Copy-Item -Path '${{ matrix.binary_path }}' -Destination 'dist\\${{ matrix.artifact_name }}' -Force"
          else
            cp "${{ matrix.binary_path }}" "dist/${{ matrix.artifact_name }}"
            chmod +x "dist/${{ matrix.artifact_name }}" || true
          fi
        shell: bash

      - name: Upload Native Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  create-release:
    name: Create Production GitHub Release
    needs: build-natives
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Native Binaries
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/
          merge-multiple: true

      - name: List downloaded release-artifacts
        run: ls -la release-artifacts || true

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
name: Build Native Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup GraalVM (JDK 21 LTS)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'gradle'

      - name: Install Linux Dependencies (GTK3 & OpenGL)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libz-dev zlib1g-dev libgtk-3-dev libavformat-dev libavcodec-dev libgl1-mesa-dev libx11-dev libxtst-dev libasound2-dev libpango1.0-dev

      - name: Setup Windows MSVC (Visual Studio C++)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Make gradlew executable (Linux/Mac)
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Compile and Link Native Image
        run: ./gradlew UI:nativeCompile UI:nativeLink --no-daemon

      # ==========================================
      # UPLOAD THE COMPILED BINARIES
      # ==========================================

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JVDM-Native-${{ matrix.os }}
          path: |
            UI/build/gluonfx/**/*.exe
            UI/build/gluonfx/**/UI
            UI/build/gluonfx/**/jvdm*
          if-no-files-found: error
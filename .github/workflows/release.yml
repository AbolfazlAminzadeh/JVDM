name: Release JVDM-UI Native

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-24.04
            artifact: JVDM-linux-x86_64

          - os: macos
            arch: aarch64
            runner: macos-latest
            artifact: JVDM-macos-arm64

          - os: windows
            arch: x86_64
            runner: windows-2022
            artifact: JVDM-windows-x86_64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: gradle

      - name: Install Native Image prerequisites (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libz-dev zlib1g-dev

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        if: matrix.os != 'windows'

      - name: Build Shadow JAR
        run: ./gradlew :UI:shadowJar --no-daemon

      - name: Build Native Image
        run: ./gradlew :UI:nativeCompile --no-daemon
        env:
          GRADLE_OPTS: "-Xmx8g"

      - name: Prepare Artifacts
        run: |
          mkdir -p artifacts
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            cp UI/build/native/nativeCompile/JVDM.exe "artifacts/${{ matrix.artifact }}"
          else
            cp UI/build/native/nativeCompile/JVDM "artifacts/${{ matrix.artifact }}"
          fi
          cp UI/build/libs/*.jar artifacts/ 2>/dev/null || true
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            artifacts/*
          generate_release_notes: true
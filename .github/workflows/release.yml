name: Release JVDM (All Platforms)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------
  # JOB 1: Build Standalone & Portable JARs (CLI & UI)
  # ---------------------------------------------------------
  build_jars:
    name: Build Portable JARs (CLI & UI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM (Java 25)
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Portable Shadow JARs
        run: ./gradlew :Core:shadowJar :UI:shadowJar --no-daemon

      - name: Prepare Clean JAR Artifacts
        run: |
          mkdir -p jar-artifacts
          cp Core/build/libs/*-UI.jar jar-artifacts/JVDM-CLI.jar 2>/dev/null || cp Core/build/libs/*.jar jar-artifacts/JVDM-CLI.jar
          cp UI/build/libs/JVDM-UI.jar jar-artifacts/JVDM-UI-Portable.jar

      - name: Upload JARs
        uses: actions/upload-artifact@v4
        with:
          name: portable-jars
          path: jar-artifacts/*
          retention-days: 1

  # ---------------------------------------------------------
  # JOB 2: Build Desktop Native Binaries (No JARs Inside!)
  # ---------------------------------------------------------
  build_desktop:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-24.04
            artifact: JVDM-linux-x86_64

          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            artifact: JVDM-linux-arm64

          - os: windows
            arch: x86_64
            runner: windows-2022
            artifact: JVDM-windows-x86_64

          - os: macos
            arch: aarch64
            runner: macos-latest
            artifact: JVDM-macos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: gradle

      - name: Install Linux GUI Dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libz-dev zlib1g-dev \
                                  libasound2-dev libavcodec-dev libavformat-dev libavutil-dev \
                                  libgl-dev libgtk-3-dev libpango1.0-dev libxtst-dev

      - name: Grant execute permission for gradlew
        if: matrix.os != 'windows'
        run: chmod +x gradlew

      - name: Build Native Image
        run: ./gradlew :UI:nativeCompile --no-daemon
        env:
          GRADLE_OPTS: "-Xmx8g"

      - name: Strip Debug Symbols (Linux & macOS)
        if: matrix.os == 'linux' || matrix.os == 'macos'
        run: strip UI/build/native/nativeCompile/JVDM || true
        shell: bash

      - name: Compress executable with UPX (Linux x86_64 Only)
        if: matrix.os == 'linux' && matrix.arch == 'x86_64'
        uses: svenstaro/upx-action@v3
        with:
          file: UI/build/native/nativeCompile/JVDM
          args: --best --lzma
          files: UI/build/native/nativeCompile/JVDM

      - name: Code Sign Windows Executable
        if: matrix.os == 'windows'
        env:
          SIGNING_CERT_BASE64: ${{ secrets.WIN_SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASS: ${{ secrets.WIN_SIGNING_CERT_PASS }}
        run: |
          if [ -z "$SIGNING_CERT_BASE64" ]; then
            echo "::warning ::WIN_SIGNING_CERT_BASE64 is missing. Skipping code-signing."
          else
            echo "Decoding certificate..."
            echo "$SIGNING_CERT_BASE64" | base64 --decode > cert.pfx
          
            echo "Signing JVDM.exe..."
            /c/Program\ Files\ \(x86\)/Windows\ Kits/10/bin/10.0.22621.0/x64/signtool.exe sign \
              /f cert.pfx \
              /p "$SIGNING_CERT_PASS" \
              /tr http://timestamp.digicert.com \
              /td sha256 \
              /fd sha256 \
              UI/build/native/nativeCompile/JVDM.exe
          
            rm cert.pfx
            echo "Successfully code-signed JVDM.exe!"
          fi
        shell: bash

      - name: Package Native Binary Only
        run: |
          mkdir -p artifacts
          cd UI/build/native/nativeCompile
          
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            7z a -tzip -mx=9 "../../../../artifacts/${{ matrix.artifact }}.zip" JVDM.exe
          else
            chmod +x JVDM
            7z a -tzip -mx=9 "../../../../artifacts/${{ matrix.artifact }}.zip" JVDM
          fi
        shell: bash

      - name: Upload Native Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          retention-days: 1

  # ---------------------------------------------------------
  # JOB 3: Build Android APK
  # ---------------------------------------------------------
  build_android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: gradle

      - name: Create local.properties
        run: |
          mkdir -p Android
          echo "sdk.dir=$ANDROID_HOME" > Android/local.properties

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Android Release APK
        run: ./gradlew :Android:assembleRelease --no-daemon --stacktrace

      - name: Package APK
        run: |
          mkdir -p artifacts
          find Android/build/outputs/apk/release -name "*.apk" -exec cp {} artifacts/JVDM-Android.apk \;

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JVDM-android
          path: artifacts/*
          retention-days: 1

  # ---------------------------------------------------------
  # JOB 4: Publish All Release Assets
  # ---------------------------------------------------------
  publish_release:
    name: Publish GitHub Release
    needs: [build_jars, build_desktop, build_android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256-Checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
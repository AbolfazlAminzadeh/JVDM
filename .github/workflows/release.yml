name: Release JVDM-UI Native

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------
  # JOB 1: Build Desktop Native Images
  # ---------------------------------------------------------
  build_desktop:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-24.04
            artifact: JVDM-linux-x86_64

          - os: macos
            arch: aarch64
            runner: macos-latest
            artifact: JVDM-macos-arm64

          - os: windows
            arch: x86_64
            runner: windows-2022
            artifact: JVDM-windows-x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          cache: gradle

      - name: Install Native Image prerequisites (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libz-dev zlib1g-dev

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        if: matrix.os != 'windows'

      - name: Build Shadow JAR
        run: ./gradlew :UI:shadowJar --no-daemon

      - name: Build Native Image
        run: ./gradlew :UI:nativeCompile --no-daemon
        env:
          GRADLE_OPTS: "-Xmx8g"

      - name: Strip Debug Symbols (Linux & macOS)
        if: matrix.os == 'linux' || matrix.os == 'macos'
        run: strip UI/build/native/nativeCompile/JVDM || true
        shell: bash

      - name: Compress executable with UPX (Linux Only)
        if: matrix.os == 'linux'
        uses: svenstaro/upx-action@v3
        with:
          file: UI/build/native/nativeCompile/JVDM
          args: --best --lzma
          files: UI/build/native/nativeCompile/JVDM

      - name: Code Sign Windows Executable
        if: matrix.os == 'windows'
        env:
          SIGNING_CERT_BASE64: ${{ secrets.WIN_SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASS: ${{ secrets.WIN_SIGNING_CERT_PASS }}
        run: |
          # Only attempt signing if the repository secret exists
          if [ -z "$SIGNING_CERT_BASE64" ]; then
            echo "::warning ::WIN_SIGNING_CERT_BASE64 is missing. Skipping code-signing. Output binary will trigger SmartScreen alerts."
          else
            echo "Decoding certificate..."
            echo "$SIGNING_CERT_BASE64" | base64 --decode > cert.pfx
          
            echo "Signing JVDM.exe..."
            # Uses standard Windows SDK SignTool pre-installed on windows-2022 runners
            /c/Program\ Files\ \(x86\)/Windows\ Kits/10/bin/10.0.22621.0/x64/signtool.exe sign \
              /f cert.pfx \
              /p "$SIGNING_CERT_PASS" \
              /tr http://timestamp.digicert.com \
              /td sha256 \
              /fd sha256 \
              UI/build/native/nativeCompile/JVDM.exe
          
            rm cert.pfx
            echo "Successfully code-signed JVDM.exe!"
          fi
        shell: bash

      - name: Zip Artifacts
        run: |
          mkdir -p artifacts
          cd UI/build/native/nativeCompile
          cp ../../libs/*.jar . 2>/dev/null || true
          
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            7z a -tzip -mx=9 "../../../../artifacts/${{ matrix.artifact }}.zip" JVDM.exe *.jar
          else
            7z a -tzip -mx=9 "../../../../artifacts/${{ matrix.artifact }}.zip" JVDM *.jar
          fi
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/*
          retention-days: 1

  # ---------------------------------------------------------
  # JOB 2: Build Android APK
  # ---------------------------------------------------------
  build_android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java for Core
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: gradle

      - name: Create local.properties
        run: |
          mkdir -p Android
          echo "sdk.dir=$ANDROID_HOME" > Android/local.properties

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Android Release APK
        run: ./gradlew :Android:assembleRelease --no-daemon --stacktrace

      - name: Zip APK
        run: |
          mkdir -p artifacts
          find Android/build/outputs/apk/release -name "*.apk" -exec 7z a -tzip -mx=9 "artifacts/JVDM-android-apk.zip" {} +

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: JVDM-android
          path: artifacts/*
          retention-days: 1

  # ---------------------------------------------------------
  # JOB 3: Publish GitHub Release
  # ---------------------------------------------------------
  publish_release:
    name: Publish Release
    needs: [build_desktop, build_android]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256-Checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
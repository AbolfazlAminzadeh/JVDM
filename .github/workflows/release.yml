name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Show working directory (debug)
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          dir

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish -c Release -o publish

      - name: Verify publish output (debug)
        run: |
          echo "Published files:"
          dir publish

      - name: Copy artifacts safely
        run: |
          if (Test-Path "publish") {
              Copy-Item "publish\*" -Destination "release" -Recurse -Force
          } else {
              Write-Error "Publish folder does not exist!"
              exit 1
          }

      - name: List release folder (debug)
        run: dir release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/**

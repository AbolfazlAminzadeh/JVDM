name: Release Native Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: linux
            arch: x86_64
            runner: ubuntu-24.04
            artifact: JVDM-linux-x86_64

          # Linux ARM64
          - os: linux
            arch: aarch64
            runner: ubuntu-24.04-arm
            artifact: JVDM-linux-aarch64

          # macOS Intel
          - os: macos
            arch: x86_64
            runner: macos-13
            artifact: JVDM-macos-x86_64

          # macOS ARM64 (Apple Silicon)
          - os: macos
            arch: aarch64
            runner: macos-latest
            artifact: JVDM-macos-arm64

          # Windows x86_64
          - os: windows
            arch: x86_64
            runner: windows-2022
            artifact: JVDM-windows-x86_64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup GraalVM JDK 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'          # Oracle GraalVM (best for Java 25)
          github-token: ${{ secrets.GITHUB_TOKEN }}
          native-image: true
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        if: matrix.os != 'windows'

      - name: Build Shadow JAR (common)
        run: ./gradlew shadowJar --no-daemon

      - name: Build Native Image
        run: ./gradlew nativeCompile --no-daemon
        env:
          # Optional: Increase memory if build is heavy
          GRADLE_OPTS: "-Xmx8g"

      - name: Rename artifact
        run: |
          mkdir -p artifacts
          if [[ "${{ matrix.os }}" == "windows" ]]; then
            cp build/native/nativeCompile/JVDM.exe "artifacts/${{ matrix.artifact }}"
          else
            cp build/native/nativeCompile/JVDM "artifacts/${{ matrix.artifact }}"
          fi
        shell: bash

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/${{ matrix.artifact }}
          retention-days: 30

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: artifacts/${{ matrix.artifact }}
          generate_release_notes: true
          draft: false
          prerelease: false
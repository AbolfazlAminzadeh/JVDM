name: Production Release Build

on:
  push:
    tags:
      - 'v*'

jobs:
  build-natives:
    name: Build Native Compiles (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: JVDM-linux-x86_64
            binary_path: build/native/nativeCompile/JVDM
          - os: windows-latest
            artifact_name: JVDM-windows-x86_64.exe
            binary_path: build/native/nativeCompile/JVDM.exe
          - os: macos-13 # Intel x86_64 Mac
            artifact_name: JVDM-macos-x86_64
            binary_path: build/native/nativeCompile/JVDM
          - os: macos-latest # Apple Silicon M1/M2/M3 ARM64 Mac
            artifact_name: JVDM-macos-aarch64
            binary_path: build/native/nativeCompile/JVDM

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup GraalVM Environment
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          native-image-job-reports: 'true'

      - name: Install System Dependencies (Linux Only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libx11-dev libxext-dev libxrender-dev libxtst-dev libxt-dev libasound2-dev libgtk-3-dev

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Native Compilation
        run: ./gradlew nativeCompile

      - name: Prepare Artifact
        shell: bash
        run: |
          mkdir -p dist/
          cp ${{ matrix.binary_path }} dist/${{ matrix.artifact_name }}

      - name: Upload Intermediary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

  create-release:
    name: Create Production GitHub Release
    needs: build-natives
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Native Binaries
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts/
          merge-multiple: true

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
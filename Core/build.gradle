plugins {
    id 'java'
    id 'application'
    id 'org.graalvm.buildtools.native'
    id 'com.gradleup.shadow'
}

java {
    sourceCompatibility = 25
    targetCompatibility = 25
    toolchain {
        languageVersion = JavaLanguageVersion.of(25);
        vendor = JvmVendorSpec.ORACLE;
    }
}

group = 'org.kroj'
version = '1.0.0'

ext.targetPlatform = project.hasProperty('targetPlatform') ? project.property('targetPlatform') :
    (System.getProperty('os.name').toLowerCase().contains('win') ? 'windows-x86_64' :
     System.getProperty('os.name').toLowerCase().contains('mac') ? (System.getProperty('os.arch').contains('aarch64') ? 'osx-aarch_64' : 'osx-x86_64') : 'linux-x86_64')

dependencies {
    def nettyVersion = "4.2.15.Final"

    // Precise Netty Modular Components (No netty-all bloat)
    implementation "io.netty:netty-common:$nettyVersion"
    implementation "io.netty:netty-buffer:$nettyVersion"
    implementation "io.netty:netty-transport:$nettyVersion"
    implementation "io.netty:netty-handler:$nettyVersion"
    implementation "io.netty:netty-codec:$nettyVersion"
    implementation "io.netty:netty-codec-http:$nettyVersion"
    implementation "io.netty:netty-codec-http2:$nettyVersion"
    implementation "io.netty:netty-codec-http3:$nettyVersion"
    implementation "io.netty:netty-resolver-dns:$nettyVersion"

    // Always include transport classes so Epoll and KQueue APIs are available for compilation cross-platform
    implementation "io.netty:netty-transport-classes-epoll:$nettyVersion"
    implementation "io.netty:netty-transport-classes-kqueue:$nettyVersion"

    // Conditional native transport based on target platform
    if (targetPlatform.startsWith("linux")) {
        implementation "io.netty:netty-transport-native-epoll:$nettyVersion:$targetPlatform"
    } else if (targetPlatform.startsWith("osx")) {
        implementation "io.netty:netty-transport-native-kqueue:$nettyVersion:$targetPlatform"
    }

    // Single-platform BoringSSL / tcnative (No cross-platform bloat)
    def boringSSLVersion = "2.0.77.Final"
    implementation "io.netty:netty-tcnative-boringssl-static:$boringSSLVersion"
    implementation "io.netty:netty-tcnative-boringssl-static:$boringSSLVersion:$targetPlatform"

    // Pure MsgPack (Jackson-databind dataformat dropped to eliminate heavy reflection)
    implementation "org.msgpack:msgpack-core:0.9.12"
}

application {
    mainClass = "org.Kroj.Core.Network.Download.Manager";
}

shadowJar {
    archiveFileName = "JVDM-UI.jar"
    mergeServiceFiles()
    exclude "META-INF/*.SF"
    exclude "META-INF/*.DSA"
    exclude "META-INF/*.RSA"
    exclude "META-INF/versions/**/module-info.class"
}

graalvmNative {
    metadataRepository {
        enabled = true
    }
    binaries {
        main {
            imageName = 'JVDM'
            mainClass = application.mainClass.get()
            debug = false
            verbose = false
            fallback = false
            sharedLibrary = false
            quickBuild = false
            richOutput = true
            useFatJar = false

//            buildArgs.add()
            buildArgs.add('-H:+UnlockExperimentalVMOptions')
            buildArgs.add('-H:IncludeResources=.*\\.(fxml|css|png|so|json|properties)')
            buildArgs.add('-H:-ReportExceptionStackTraces')
            buildArgs.add('--gc=serial')
            buildArgs.add('--no-fallback')
            buildArgs.add('--enable-native-access=ALL-UNNAMED')
            buildArgs.add('--enable-url-protocols=http,https')
            buildArgs.add('-Os')
            buildArgs.add('--initialize-at-run-time=io.netty.handler.ssl.ReferenceCountedOpenSslEngine')
            buildArgs.add('--initialize-at-run-time=io.netty.internal.tcnative.CertificateVerifier')
            buildArgs.add('--initialize-at-run-time=io.netty.internal.tcnative.SSLPrivateKeyMethod')
            buildArgs.add('--initialize-at-run-time=io.netty.internal.tcnative.CertificateCompressionAlgo')
            buildArgs.add('--initialize-at-run-time=io.netty.internal.tcnative.AsyncSSLPrivateKeyMethod')
            buildArgs.add('--initialize-at-run-time=io.netty.internal.tcnative.SSL')
            buildArgs.add('--initialize-at-run-time=io.netty.internal.tcnative.SSLContext')
            buildArgs.add('--initialize-at-run-time=org.Kroj.Core.Network.Download.Security.TLS')
        }
    }
}

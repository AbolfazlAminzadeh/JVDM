plugins {
    id 'java'
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    id 'com.gradleup.shadow' version '9.3.2'
    id 'com.gluonhq.gluonfx-gradle-plugin' version '1.0.23'
}

group = 'org.kroj'
version = '1.0.0'

dependencies {
    implementation project(":Core")
    implementation 'io.github.mkpaz:atlantafx-base:2.1.0'

    def jfx = javafx.version
    def OSes = ['win', 'mac', 'mac-aarch64', 'linux'];

    OSes.forEach { os ->
        runtimeOnly "org.openjfx:javafx-base:$jfx:$os"
        runtimeOnly "org.openjfx:javafx-graphics:$jfx:$os"
        runtimeOnly "org.openjfx:javafx-controls:$jfx:$os"
        runtimeOnly "org.openjfx:javafx-fxml:$jfx:$os"
    }

}

javafx {
    version = "21.0.2"
    modules = [ 'javafx.controls', 'javafx.fxml', 'javafx.graphics', 'javafx.base' ]
}

application {
    mainClass = "org.Kroj.UI.Main"
}

shadowJar {
    archiveFileName = "JVDM-UI.jar"
    mergeServiceFiles()
}

gluonfx {
    target = "host"

    compilerArgs = [
        "--no-fallback",
        "--enable-native-access=ALL-UNNAMED",
        "-H:+UnlockExperimentalVMOptions",
        "-H:IncludeResources=.*",
        "--enable-url-protocols=http,https",
        "--gc=serial",
        "-O0",
        "--initialize-at-run-time=io.netty"
    ]

}